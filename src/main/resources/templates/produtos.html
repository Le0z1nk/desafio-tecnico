<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de pedidos</title>
    <link rel="stylesheet" href="produtos_styles.css" />
</head>

<body>
    <header>
        <h1>GESTÃO DE PEDIDOS</h1>
        <button id="openModal">Cadastrar produto</button>
    </header>
    <main>
        <div id="myModal" class="modal">
            <div class="modalContent">
                <div class="close">&times;</div>
                <h2>Cadastrar Produto</h2>
                <form class="formProduto">
                    <div>
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" placeholder="digite o nome">
                    </div>
                    <div>
                        <label for="categoria">Categoria: </label>
                        <input type="text" id="categoria" placeholder="digite a categoria" />
                    </div>
                    <div>
                        <label for="preco">Preço:</label>
                        <input type="number" id="preco" name="preco" placeholder="digite o preço">
                    </div>
                    <div>
                        <label>Ativo</label>
                        <input type="radio"  name="active"/>
                        <label>Inativo</label>
                        <input type="radio"  name="active"/>
                    </div>
                    <button type="submit" onclick=createProduct()>Cadastrar</button>
                </form>
            </div>
        </div>
    </main>
    <script src="conexao.js"></script>
    <script src="modal.js"></script>
</body>

</html>
