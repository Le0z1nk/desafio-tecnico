<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de pedidos</title>
    <link rel="stylesheet" href="cadastro_style.css" />
</head>

<body>
    <section class="sectionCadastro">
        <h1>Cadastro</h1>

        <form class="formCadastro">
            <div class="divInput">
                <label for="name">Nome:</label>
                <input id="name" type="text" name="name" placeholder="Digite seu nome" required />
            </div>
            <div class="divInput">
                <label for="email">Email:</label>
                <input id="email" type="email" name="email" placeholder="Digite seu email" required />
            </div>
            <button type="submit">Cadastrar</button>
        </form>
        <a href="index.html"><p class="login">Possui uma conta? Fazer Login</p></a>
    </section>
    <script src="cadastro.js"></script>
</body>
