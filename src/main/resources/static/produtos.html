<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de pedidos</title>
    <link rel="stylesheet" href="produtos_style.css" />
</head>

<body>
    <header>
        <h1>GESTÃO DE PEDIDOS</h1>
		<div class="divBusca">
		     <svg width="20px" height="20px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
		          <path
		               d="M15.7955 15.8111L21 21M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z"
		               stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
		     </svg>
		     <input type="text" id="inputBusca" placeholder="Pesquisar produtos..." />
		</div>
        <button id="openModal">Cadastrar produto</button>
    </header>
    <main>
        <div id="modalProduto" class="modal">
            <div class="modalContent">
                <div class="close">&times;</div>
                <h2>Cadastrar Produto</h2>
                <form class="formProduto">
                    <div class="divInput">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" placeholder="digite o nome">
                    </div>
                    <div class="divInput">
                        <label for="categoria">Categoria: </label>
                        <input type="text" id="categoria" placeholder="digite a categoria" />
                    </div>
                    <div class="divInput">
                        <label for="preco">Preço:</label>
                        <input type="number" id="preco" name="preco" placeholder="digite o preço">
                    </div>
                    <div>
                        <label>Ativo</label>
                        <input type="radio"  name="active" value="true" />
                        <label>Inativo</label>
                        <input type="radio"  name="active" value="false" />
                    </div>
                    <button type="submit">Cadastrar</button>
                </form>
            </div>
        </div>
		
		<div id="modalPedido" class="modal">
		           <div class="modalContentPedido">
		               <div class="closePedido">&times;</div>
		               <h2>Cadastrar Pedido</h2>
		               <form class="formProduto">
		                   <div class="divInput">
		                       <label for="quantity">Quantidade:</label>
		                       <input type="number" id="quantity" name="quantity" placeholder="digite a quantidade">
		                   </div>
		                   <button id="openModalPedido" type="submit">Cadastrar</button>
		               </form>
					   <p class="precoTotal">Preço total:</p>
		           </div>
		       </div>
		
        <h1>Lista de Produtos</h1>
		<div class="filtro">
		     <p>Filtrar por categoria: </p>
		     <input type="text" id="inputFiltro" />
		</div>
        <section id="sectionProdutos">
        </section>
    </main>
    <script src="conexao.js"></script>
    <script src="modal.js"></script>
	<script src="modalPedido.js"></script>
    <script src="cardProdutos.js"></script>
</body>

</html>
